name: Deploy Frontend to Azure Container Apps


on:
  push:
    branches: [ dev ]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: gfsacr001
  RESOURCE_GROUP: rg_GFS
  CONTAINER_APP_NAME: fe-gfs
  IMAGE_NAME: fe-gfs
  AZURE_CONTAINERAPPS_ENVIRONMENT: gfs-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build --no-cache \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            .

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      # Verify Container App Exists
      - name: Verify Container App Exists
        run: |
          az containerapp show \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP

      # Configure Frontend Ingress
      - name: Configure Frontend Ingress
        run: |
          az containerapp ingress update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --type external \
            --target-port 80

      # Deploy Frontend
      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            --cpu 2 \
            --memory 4Gi \
            --set-env-vars NODE_ENV=production
