name: Deploy GFS AI

on:
  push:
    branches: [ dev ]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: gfsacr001
  RESOURCE_GROUP: rg_GFS
  CONTAINER_APP_NAME: gfs-ai
  IMAGE_NAME: gfs-ai

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: az acr login --name $ACR_NAME

      - run: |
          docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            --set-env-vars \
            AZURE_OPENAI_KEY='${{ secrets.AZURE_OPENAI_KEY }}' \
            AZURE_OPENAI_ENDPOINT='${{ secrets.AZURE_OPENAI_ENDPOINT }}' \
            AZURE_OPENAI_CHAT_DEPLOYMENT='${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}' \
            AZURE_OPENAI_API_VERSION='${{ secrets.AZURE_OPENAI_API_VERSION }}' \
            AZURE_SERVICE_BUS_CONNECTION_STRING='${{ secrets.AZURE_SERVICE_BUS_CONNECTION_STRING }}' \
            AZURE_SERVICE_BUS_QUEUE_NAME='${{ secrets.AZURE_SERVICE_BUS_QUEUE_NAME }}' \
            AZURE_SERVICE_BUS_EXTRACTION_STAGE_QUEUE_NAME='${{ secrets.AZURE_SERVICE_BUS_EXTRACTION_STAGE_QUEUE_NAME }}' \
            AZURE_SERVICE_BUS_TEAMS_QUEUE_NAME='${{ secrets.AZURE_SERVICE_BUS_TEAMS_QUEUE_NAME }}' \
            AZURE_SERVICE_BUS_TEAMS_DLQ_NAME='${{ secrets.AZURE_SERVICE_BUS_TEAMS_DLQ_NAME }}' \
            WEBHOOK_URL='${{ secrets.WEBHOOK_URL }}' \
            FASTAPI_BASE_URL='${{ secrets.FASTAPI_BASE_URL }}' \
            APP_BASE_URL='${{ secrets.APP_BASE_URL }}' \
            GFS_EMAIL='${{ secrets.GFS_EMAIL }}' \
            GFS_PASSWORD='${{ secrets.GFS_PASSWORD }}' \
            AZURE_DOC_INTELLIGENCE_ENDPOINT='${{ secrets.AZURE_DOC_INTELLIGENCE_ENDPOINT }}' \
            AZURE_DOC_INTELLIGENCE_KEY='${{ secrets.AZURE_DOC_INTELLIGENCE_KEY }}' \
            MONGO_URI='${{ secrets.MONGO_URI }}' \
            STAGE0_WEBHOOK_PATH='${{ secrets.STAGE0_WEBHOOK_PATH }}' \
            STAGE_RESULT_WEBHOOK_PATH='${{ secrets.STAGE_RESULT_WEBHOOK_PATH }}' \
            AI_ENV='${{ secrets.AI_ENV }}'
