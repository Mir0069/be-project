name: Deploy Backend to Azure Container Apps


on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: gfsacr001
  RESOURCE_GROUP: rg_GFS
  CONTAINER_APP_NAME: be-gfs
  IMAGE_NAME: be-gfs
  AZURE_CONTAINERAPPS_ENVIRONMENT: gfs-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build --no-cache \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            .

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      # Deploy Backend with Environment Variables
      - name: Deploy Backend
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > .env
          grep -v '^#' .env | grep -v '^$' > .env.cleaned
          while IFS='=' read -r key val; do
            [ -n "$key" ] && export "$key=$val"
          done < .env.cleaned
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            --cpu 4 \
            --memory 8Gi \
            --set-env-vars \
            "NODE_ENV=$NODE_ENV" \
            "PORT=$PORT" \
            "API_VERSION=$API_VERSION" \
            "APP_BASE_URL=$APP_BASE_URL" \
            "FRONTEND_URL=$FRONTEND_URL" \
            "VITE_API_BASE_URL=$VITE_API_BASE_URL" \
            "JWT_SECRET=$JWT_SECRET" \
            "JWT_ACCESS_EXPIRES_IN=$JWT_ACCESS_EXPIRES_IN" \
            "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET" \
            "JWT_REFRESH_EXPIRES_IN=$JWT_REFRESH_EXPIRES_IN" \
            "SUPER_ADMIN_PASSWORD=$SUPER_ADMIN_PASSWORD" \
            "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
            "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
            "MICROSOFT_CLIENT_ID=$MICROSOFT_CLIENT_ID" \
            "MICROSOFT_CLIENT_SECRET=$MICROSOFT_CLIENT_SECRET" \
            "MICROSOFT_TENANT_ID=$MICROSOFT_TENANT_ID" \
            "MICROSOFT_REDIRECT_URI=$MICROSOFT_REDIRECT_URI" \
            "MONGODB_URI=$MONGODB_URI" \
            "ZOHO_CLIENT_ID=$ZOHO_CLIENT_ID" \
            "ZOHO_CLIENT_SECRET=$ZOHO_CLIENT_SECRET" \
            "ZOHO_REDIRECT_URI=$ZOHO_REDIRECT_URI" \
            "ZOHO_API_DOMAIN=$ZOHO_API_DOMAIN" \
            "ZOHO_ACCOUNTS_URL=$ZOHO_ACCOUNTS_URL" \
            "ZOHO_SCOPES=$ZOHO_SCOPES" \
            "ZOHO_USE_SANDBOX=$ZOHO_USE_SANDBOX" \
            "ZOHO_DEFAULT_LEAD_OWNER=$ZOHO_DEFAULT_LEAD_OWNER" \
            "ZOHO_POLLING_ENABLED=$ZOHO_POLLING_ENABLED" \
            "ZOHO_POLL_INTERVAL_MS=$ZOHO_POLL_INTERVAL_MS" \
            "OUTLOOK_CLIENT_ID=$OUTLOOK_CLIENT_ID" \
            "OUTLOOK_CLIENT_SECRET=$OUTLOOK_CLIENT_SECRET" \
            "OUTLOOK_TENANT_ID=$OUTLOOK_TENANT_ID" \
            "OUTLOOK_POLLING_ENABLED=$OUTLOOK_POLLING_ENABLED" \
            "OUTLOOK_POLL_INTERVAL_MS=$OUTLOOK_POLL_INTERVAL_MS" \
            "OUTLOOK_FILE_INGEST_ENABLED=$OUTLOOK_FILE_INGEST_ENABLED" \
            "OUTLOOK_EMAIL_INGEST_ENABLED=$OUTLOOK_EMAIL_INGEST_ENABLED" \
            "OUTLOOK_DELETE_AFTER_INGEST=$OUTLOOK_DELETE_AFTER_INGEST" \
            "OUTLOOK_CENTRALIZED_MAILBOX=$OUTLOOK_CENTRALIZED_MAILBOX" \
            "OUTLOOK_GRAPH_BASE_URL=$OUTLOOK_GRAPH_BASE_URL" \
            "TEAMS_CLIENT_ID=$TEAMS_CLIENT_ID" \
            "TEAMS_CLIENT_SECRET=$TEAMS_CLIENT_SECRET" \
            "TEAMS_TENANT_ID=$TEAMS_TENANT_ID" \
            "TEAMS_TEST_USER_ID=$TEAMS_TEST_USER_ID" \
            "TEAMS_POLLING_ENABLED=$TEAMS_POLLING_ENABLED" \
            "TEAMS_POLL_INTERVAL_MS=$TEAMS_POLL_INTERVAL_MS" \
