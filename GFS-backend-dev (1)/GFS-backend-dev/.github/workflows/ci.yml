            "TEAMS_WEBHOOK_BASE_URL=$TEAMS_WEBHOOK_BASE_URL" \
            "TEAMS_WEBHOOK_CLIENT_STATE=$TEAMS_WEBHOOK_CLIENT_STATE" \
            "TEAMS_AI_DISPATCH_ENABLED=$TEAMS_AI_DISPATCH_ENABLED" \
            "GRAPH_TENANT_ID=$GRAPH_TENANT_ID" \
            "GRAPH_CLIENT_ID=$GRAPH_CLIENT_ID" \
            "GRAPH_CLIENT_SECRET=$GRAPH_CLIENT_SECRET" \
            "AZURE_STORAGE_CONNECTION_STRING=$AZURE_STORAGE_CONNECTION_STRING" \
            "AZURE_STORAGE_CONTAINER_NAME=$AZURE_STORAGE_CONTAINER_NAME" \
            "AZURE_SERVICE_BUS_CONNECTION_STRING=$AZURE_SERVICE_BUS_CONNECTION_STRING" \
            "AZURE_SERVICE_BUS_AI_QUEUE_NAME=$AZURE_SERVICE_BUS_AI_QUEUE_NAME" \
            "AZURE_SERVICE_BUS_DLQ_NAME=$AZURE_SERVICE_BUS_DLQ_NAME" \
            "AZURE_SERVICE_BUS_TEAMS_QUEUE_NAME=$AZURE_SERVICE_BUS_TEAMS_QUEUE_NAME" \
            "AZURE_SERVICE_BUS_TEAMS_DLQ_NAME=$AZURE_SERVICE_BUS_TEAMS_DLQ_NAME" \
            "AZURE_SERVICE_BUS_DEFENDER_QUEUE_NAME=$AZURE_SERVICE_BUS_DEFENDER_QUEUE_NAME" \
            "AZURE_SERVICE_BUS_DEFENDER_DLQ_NAME=$AZURE_SERVICE_BUS_DEFENDER_DLQ_NAME" \
            "AZURE_SERVICE_BUS_EXTRACTION_STAGE_QUEUE_NAME=$AZURE_SERVICE_BUS_EXTRACTION_STAGE_QUEUE_NAME" \
            "AZURE_SERVICE_BUS_EXTRACTION_STAGE_DLQ_NAME=$AZURE_SERVICE_BUS_EXTRACTION_STAGE_DLQ_NAME" \
            "AZURE_SERVICE_BUS_EXTRACTION_RESULT_QUEUE_NAME=$AZURE_SERVICE_BUS_EXTRACTION_RESULT_QUEUE_NAME" \
            "AZURE_SERVICE_BUS_EXTRACTION_RESULT_DLQ_NAME=$AZURE_SERVICE_BUS_EXTRACTION_RESULT_DLQ_NAME" \
            "QUEUE_PROVIDER=$QUEUE_PROVIDER" \
            "MAIL_SENDER=$MAIL_SENDER" \
            "RATE_LIMIT_WINDOW_MS=$RATE_LIMIT_WINDOW_MS" \
            "RATE_LIMIT_MAX_REQUESTS=$RATE_LIMIT_MAX_REQUESTS" \
            "LOG_LEVEL=$LOG_LEVEL" \
            "DROPBOX_CLIENT_ID=$DROPBOX_CLIENT_ID" \
            "DROPBOX_CLIENT_SECRET=$DROPBOX_CLIENT_SECRET" \
            "DROPBOX_REFRESH_TOKEN=$DROPBOX_REFRESH_TOKEN" \
            "DROPBOX_ROOT_PATH=$DROPBOX_ROOT_PATH" \
            "DROPBOX_SYNC_INTERVAL_MS=$DROPBOX_SYNC_INTERVAL_MS" \
            "CLOUD_LINKS_SUPPORTED_EXTENSIONS=$CLOUD_LINKS_SUPPORTED_EXTENSIONS" \
            "AZURE_SPEECH_KEY=$AZURE_SPEECH_KEY" \
            "AZURE_SPEECH_REGION=$AZURE_SPEECH_REGION" \
            "AZURE_SPEECH_ENDPOINT=$AZURE_SPEECH_ENDPOINT" \
            "AZURE_SPEECH_RESOURCE_NAME=$AZURE_SPEECH_RESOURCE_NAME"
