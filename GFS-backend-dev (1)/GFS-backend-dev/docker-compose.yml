name: gfs

services:
  frontend:
    build:
      context: ../GFS-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: gfs_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - gfs_network
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gfs_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    networks:
      - gfs_network
    depends_on:
      mongodb:
        condition: service_healthy
      azurite:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  ai:
    build:
      context: ../GFS-AI
      dockerfile: Dockerfile
    container_name: gfs_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-${AZURE_OPENAI_KEY:-}}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-${AZURE_OPENAI_API_KEY:-}}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
    volumes:
      - ai_output:/app/output
    networks:
      - gfs_network

  mongodb:
    image: mongo:7.0
    container_name: gfs_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gfs_dev
    volumes:
      - mongo_data:/data/db
    networks:
      - gfs_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: gfs_azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    networks:
      - gfs_network

volumes:
  mongo_data:
    driver: local
  azurite_data:
    driver: local
  ai_output:
    driver: local

networks:
  gfs_network:
    driver: bridge
